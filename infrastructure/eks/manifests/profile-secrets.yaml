apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: profile-service-secrets
  namespace: default

spec:
  provider: aws

  parameters:
    usePodIdentity: "true"

    objects: |
      - objectName: "streaming/profile-service/mongo-url"
        objectType: "secretsmanager"
        objectAlias: "MONGO_URL"

  secretObjects:
    - secretName: profile-service-secret
      type: Opaque
      data:
        - objectName: "MONGO_URL"
          key: MONGO_URL